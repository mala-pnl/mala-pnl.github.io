<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>損益試算已搬家</title>
<style>
  :root { --bg:#f3f4f8; --card:#fff; --ink:#1f2430; --sub:#5b6270; --brand:#E8380D; --brand-dark:#b82c09; --line:#e3e5ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1d2029; --ink:#eceef4; --sub:#9aa1b2; --line:#2c303c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:28px 22px; text-align:center; }
  h1 { margin:0 0 10px; font-size:20px; line-height:1.4; }
  p { margin:0 0 20px; color:var(--sub); font-size:15px; line-height:1.7; }
  a.btn { display:inline-block; padding:12px 22px; border-radius:10px; background:var(--brand-dark); color:#fff;
    text-decoration:none; font-size:16px; font-weight:600; }
  a.btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
</style>
</head>
<body>
<main class="card">
  <h1>損益試算已搬進鼎兆元管理系統</h1>
  <p>請從管理系統進入：<br>財務部門 → 損益試算</p>
  <a class="btn" href="https://dzy.mozhuting.com/">前往管理系統</a>
</main>
</body>
</html>
